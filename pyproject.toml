[project]
name = "jobpilot-cn"
version = "0.2.0"
description = "Boss 直聘 / 猎聘 岗位与 JD 全文抓取器：抓岗 → 抓 JD 全文 → 导出 JSON/CSV"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "GriffithLin" }]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "playwright>=1.45",
]

[project.scripts]
jp = "jobpilot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobpilot"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
